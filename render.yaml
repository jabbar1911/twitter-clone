services:
  - type: web
    name: twitter-clone
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Twitter
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://twitter-clone.onrender.com
      - key: DB_CONNECTION
        fromDatabase:
          name: twitter-db
          property: connection
      - key: DB_HOST
        fromDatabase:
          name: twitter-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: twitter-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: twitter-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: twitter-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: twitter-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

databases:
  - name: twitter-db
    plan: free
    region: oregon
    databaseName: twitter_clone
    user: twitter_user
